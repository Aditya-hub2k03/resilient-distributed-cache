version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: selfheal_dc
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init-schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: dc-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dc-node-1
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: selfheal_dc
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
