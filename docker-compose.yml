version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: selfheal_dc
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init-schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: dc-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: dc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: dc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: dc-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  node-1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dc-node-1
    environment:
      NODE_ID: node-1
      NODE_HOST: node-1
      PORT: 8081
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DC_CLUSTER_API_KEY: ${DC_CLUSTER_API_KEY:-dc-secret-cluster-token-xyz}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    

  node-2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dc-node-2
    environment:
      NODE_ID: node-2
      NODE_HOST: node-2
      PORT: 8082
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DC_CLUSTER_API_KEY: ${DC_CLUSTER_API_KEY:-dc-secret-cluster-token-xyz}
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    

  node-3:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dc-node-3
    environment:
      NODE_ID: node-3
      NODE_HOST: node-3
      PORT: 8083
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DC_CLUSTER_API_KEY: ${DC_CLUSTER_API_KEY:-dc-secret-cluster-token-xyz}
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    
